<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>채용 설문지 만들기</title><style>
:root{font-family:Arial,'Malgun Gothic',sans-serif;color:#172b4b;background:#f2f5fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0;font-size:15px;line-height:1.65}button,input,textarea{font:inherit}button,a.button{cursor:pointer;border:1px solid #d8e0ec;background:#fff;border-radius:9px;padding:10px 15px;color:#243956;text-decoration:none}button:hover,a.button:hover{border-color:#4c79e8;background:#f4f7ff}button:disabled{cursor:not-allowed;opacity:.45}button.primary,.primary{background:#2862df!important;color:white!important;border-color:#2862df}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8bacfa;outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:25px;letter-spacing:-1px}h2{font-size:19px}h3{font-size:16px}.muted{color:#687990;font-size:14px}.header{background:white;padding:25px 4%;border-bottom:1px solid #dfe5ef;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:14px}.icon{background:#2862df;color:white;border-radius:12px;width:45px;height:45px;display:grid;place-items:center;font-size:24px}.workspace{display:grid;grid-template-columns:minmax(400px,1fr) minmax(400px,1fr);gap:25px;max-width:1500px;margin:auto;padding:28px 4%}.panel{background:white;border:1px solid #dfe5ef;border-radius:15px;padding:25px;margin-bottom:20px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.count{color:#2862df;background:#edf3ff;border-radius:25px;padding:4px 12px;font-size:13px;font-weight:bold;white-space:nowrap}.traits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.trait{font-size:14px;padding:10px 4px;white-space:normal}.trait.active{background:#edf3ff;color:#235bd0;border-color:#477aea;font-weight:bold}.tabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid #e1e7f1;padding-bottom:12px;margin-bottom:12px}.tabs .active{color:#245fda;background:#edf3ff;border-color:#779be re-wrap;margin:10px 0}.status:empty{display:none}.success{color:#187454}.single{max-width:850px;padding:35px 20px;margin:auto}.info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.badge{background:#eaf1ff;color:#2862df;padding:4px 9px;font-size:12px;border-radius:20px;margin-left:8px}dialog{border:1px solid #d8e2f3;border-radius:16px;padding:28px;width:min(560px,92vw);color:#172b4b}dialog::backdrop{background:#14264380}dialog h2{margin-bottom:15px}dialog input{margin:20px 0}details{background:white;border:1px solid #dce3ee;border-radius:10px;margin:12px 0;padding:18px}summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}.details-body{border-top:1px solid #e0e6ef;padding-top:15px;margin-top:15px}.saved-answer{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fb;padding:15px;border-radius:8px;margin:8px 0 22px}.footer-note{text-align:center;color:#8995a7;font-size:12px;margin:20px}.sticky{position:sticky;top:20px}.preview-scroll{max-height:calc(100vh - 200px);overflow:auto}.complete{text-align:center;padding:75px 25px}.complete .icon{margin:0 auto 20px;background:#e8f5ee;color:#238450;border-radius:50%;width:65px;height:65px}.topline{font-size:12px;color:#7e91ad;letter-spacing:1px;margin-bottom:15px}@media(max-width:900px){.workspace{grid-template-columns:1fr;padding:20px 15px}.sticky{position:static}.preview-scroll{max-height:none}.header{padding:20px;align-items:flex-start}.header h1{font-size:21px}.header .icon{display:none}.header a.button{font-size:12px;padding:8px;white-space:nowrap}.info-grid{grid-template-columns:1fr}.paper{padding:23px}.panel{padding:20px}.traits{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:440px){.header{flex-wrap:wrap}.traits{grid-template-columns:repeat(2,minmax(0,1fr))}.section-head{flex-wrap:wrap}}

:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;color:#252731;background:#eef0f6}body{background:radial-gradient(ellipse at 0 0,#e2e7fc,transparent 55%),radial-gradient(ellipse at 100% 20%,#f3e6f4,transparent 55%),#eef0f6}.header{background:#ffffffb8;backdrop-filter:blur(24px);border-bottom:1px solid #fff9;padding:23px 4%}.brand:before{content:'● ● ●';color:#ff6259;font-size:13px;letter-spacing:3px;text-shadow:0 1px 1px #0001}.icon{background:linear-gradient(145deg,#75aaff,#3568e6);box-shadow:0 4px 12px #4478d52b}.panel,.paper{background:#ffffffd9;border:1px solid #fff;border-radius:20px;box-shadow:0 8px 28px #23365609,0 1px 3px #2336560d}.panel{padding:26px}.paper-top{border-bottom:1px solid #dce1eb}button,a.button{min-height:44px;border-radius:11px;border-color:#dce0e8;box-shadow:0 1px 2px #00000008}button.primary{background:linear-gradient(#438bfa,#2473e8)!important;box-shadow:0 3px 8px #2b70e82b}.trait.active{background:#e9f1ff;border-color:#83b2ff;color:#1664d8}.count{background:#edf2fc;color:#326ad5}.tabs{border-bottom-color:#e7eaf0}.tabs button{border-radius:10px}.choice{border-radius:10px;margin:3px 0}.group-title{background:#f0f4fb;color:#41689a}.paper-top .eyebrow{letter-spacing:1.2px;color:#6b7f9c}.notice{background:#eff4fc}input,textarea{background:#fcfcfe;border-radius:12px;border-color:#dce1e9}h1{font-weight:700;letter-spacing:-.9px}.workspace{gap:28px}.preview-head{flex-wrap:wrap}dialog{border-radius:22px;box-shadow:0 24px 80px #18264040;background:#fbfcff}

</style></head><body><div id="app"></div><dialog id="linkDialog" aria-labelledby="dialogTitle"><h2 id="dialogTitle">설문 링크를 만들었어요</h2><p class="muted">아래 링크를 지원자에게 전달해 주세요.<br>지금 선택한 질문이 그대로 담겨 있어요.</p><input id="linkValue" aria-label="설문 주소" readonly><div class="inline"><button id="copyLink" class="primary">링크 복사</button><a class="button" id="openSurvey" target="_blank" rel="noopener">설문지 열기 ↗</a><button id="closeDialog">닫기</button></div><p id="copyStatus" role="status" class="status"></p></dialog>
<script>
/*DATA*/
/*SHARED*/
const MODE="__MODE__",app=document.querySelector('#app'),$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(storage,key,fallback)=>{try{return JSON.parse(storage.getItem(key))||fallback}catch{return fallback}};
const save=(storage,key,v)=>{try{storage.setItem(key,JSON.stringify(v));return true}catch{return false}};
async function api(path,options={}){let r;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);try{r=await fetch(path,{cache:'no-store',...options,signal:controller.signal})}catch{throw Error('서버 연결이 지연되거나 끊겼어요. 입력은 유지돼요. 다시 시도해 주세요.')}finally{clearTimeout(timer)}let data;try{data=await r.json()}catch{throw Error('서버 응답을 확인하지 못했어요. 다시 시도해 주세요.')}if(!r.ok)throw Object.assign(Error(data.error||'요청에 실패했어요.'),{status:r.status});return data;}
function paperTop(){return '<div class="paper-top"><div class="eyebrow">팡뮤제&짙은 · JOIN OUR TEAM</div><h2>팡뮤제&짙은 채용 설문지</h2><p class="muted">정답은 없어요. 본인의 경험과 생각을 편하게 적어주세요.</p></div>'}
function questionMarkup(qs,preview=false){let last='',html='';qs.forEach((q,i)=>{if(q.trait!==last){last=q.trait;html+=`<h3 class="group-title">${esc(last)} <small>· ${qs.filter(x=>x.trait===last).length}문항</small></h3>`}html+=`<div class="answer"><label class="question-text" for="a-${q.key}">${i+1}. ${esc(q.question)}</label><textarea id="a-${q.key}" name="${q.key}" maxlength="5000" ${preview?'':'required'} placeholder="답변을 입력해 주세요"></textarea></div>`});return html;}
let state=read(localStorage,'hiring-builder-v1',{v:1,selected:[],chosen:{},custom:[]}),tab;
function sanitize(){const s={v:1,selected:[],chosen:{},custom:[]};for(const t of Array.isArray(state.selected)?state.selected:[]){if(Number.isInteger(t)&&t>=0&&t<30&&!s.selected.includes(t)&&s.selected.length<3){s.selected.push(t);s.chosen[t]=[...new Set(Array.isArray(state.chosen?.[t])?state.chosen[t]:[])].filter(q=>Number.isInteger(q)&&q>=0&&q<30)}}let n=0;for(const t of s.selected)s.chosen[t]=s.chosen[t].filter(()=>n++<10);s.custom=(Array.isArray(state.custom)?state.custom:[]).filter(q=>typeof q==='string'&&q.trim()&&q.length<=500).slice(0,20);state=s;tab=s.selected[0]}
sanitize();const count=()=>state.selected.reduce((n,t)=>n+state.chosen[t].length,0);
function persist(){save(localStorage,'hiring-builder-v1',state)}
function builder(){app.innerHTML=`<header class="header"><div class="brand"><span class="icon">▤</span><div><h1>채용 설문지 만들기</h1><p class="muted">팡뮤제&짙은 · 함께할 동료를 위한 질문</p></div></div><div><a class="button" href="/admin">지원자 응답 확인 ↗</a><span id="unread"></span></div></header><main class="workspace"><div><section class="panel"><div class="section-head"><div><h2>1. 인재상 선택</h2><p class="muted">최대 3개까지 선택할 수 있어요.</p></div><span class="count" id="traitCount"></span></div><div class="traits" id="traits"></div></section><section class="panel"><div class="section-head"><div><h2>2. 질문 선택</h2><p class="muted">선택한 인재상의 질문을 합쳐서 총 10개를 골라주세요.</p></div><span class="count" id="questionCount"></span></div><div class="tabs" id="tabs"></div><div class="questions" id="questions"></div><div class="progress"><div id="progress"></div></div><p class="muted" id="remaining" style="margin-top:10px" aria-live="polite"></p></section><section class="panel"><h2>3. 직접 질문 추가</h2><p class="muted">사장님이 더 묻고 싶은 내용을 넣어주세요.</p><label class="field" for="customInput">추가할 질문</label><textarea id="customInput" maxlength="500" placeholder="예: 우리 매장에서 일하며 배우고 싶은 것은 무엇인가요?"></textarea><div class="inline"><small class="muted" id="customLength">0 / 500자</small><button id="addCustom">＋ 질문 추가</button></div><p id="customError" class="status" role="status"></p><div id="customList"></div></section></div><div><div class="sticky"><div class="section-head preview-head"><div><h2>설문지 미리보기 <span class="count" id="total"></span></h2><p class="muted" id="previewProgress"></p></div><button class="primary" id="makeLink">설문 링크 만들기 ↗</button></div><div class="paper preview-scroll" id="preview"></div><p class="footer-note">기본 질문 10개 + 직접 질문 · 선택 내용은 이 브라우저에 저장돼요</p></div></div></main>`;
 $('#customInput').oninput=e=>$('#customLength').textContent=e.target.value.length+' / 500자';
 $('#addCustom').onclick=()=>{const q=$('#customInput').value.trim();if(!q||q.length>500||state.custom.length>=20){$('#customError').textContent=!q?'추가할 질문을 입력해 주세요.':state.custom.length>=20?'직접 질문은 최대 20개까지 추가할 수 있어요.':'질문은 500자 이내로 입력해 주세요.';return}state.custom.push(q);$('#customInput').value='';$('#customLength').textContent='0 / 500자';$('#customError').textContent='';update()};
 $('#makeLink').onclick=()=>{try{surveyQuestions(state);const bytes=new TextEncoder().encode(JSON.stringify(state));const token=btoa(String.fromCharCode(...bytes)).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'');const url=location.origin+'/#survey='+token;$('#linkValue').value=url;$('#openSurvey').href=url;$('#copyStatus').textContent='';$('#linkDialog').showModal()}catch(e){$('#previewProgress').textContent=e.message}};
 update();refreshBadge();window.addEventListener('focus',refreshBadge);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshBadge()});
}
function update(){persist();const n=count();$('#traitCount').textContent=state.selected.length+' / 3';$('#questionCount').textContent=n+' / 10';$('#traits').innerHTML=TRAITS.map((t,i)=>`<button class="trait ${state.selected.includes(i)?'active':''}" aria-pressed="${state.selected.includes(i)}" data-trait="${i}" ${state.selected.length===3&&!state.selected.includes(i)?'disabled':''}>${state.selected.includes(i)?'✓ ':''}${esc(t.name)}</button>`).join('');
 document.querySelectorAll('[data-trait]').forEach(b=>b.onclick=()=>{const t=+b.dataset.trait;if(state.selected.includes(t)){state.selected=state.selected.filter(x=>x!==t);delete state.chosen[t];if(tab===t)tab=state.selected[0]}else{if(state.selected.length>=3)return;state.selected.push(t);state.chosen[t]=[];tab=t}update()});
 $('#tabs').innerHTML=state.selected.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}" aria-pressed="${tab===t}">${esc(TRAITS[t].name)} · ${state.chosen[t].length}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;update()});
 const scroll=$('#questions').scrollTop;$('#questions').innerHTML=tab===undefined?'<div class="empty"><span class="empty-icon">☑</span><b>어떤 동료와 함께하고 싶나요?</b>먼저 위에서 인재상을 선택해 주세요.</div>':TRAITS[tab].questions.map((q,i)=>`<label class="choice"><input type="checkbox" data-question="${i}" ${state.chosen[tab].includes(i)?'checked':n>=10?'disabled':''}><span><small>${['실제 경험','상황 대응','업무 태도'][Math.floor(i/10)]} · ${i+1}번</small>${esc(q)}</span></label>`).join('');$('#questions').scrollTop=scroll;document.querySelectorAll('[data-question]').forEach(c=>c.onchange=()=>{const q=+c.dataset.question;if(c.checked&&count()<10)state.chosen[tab].push(q);else state.chosen[tab]=state.chosen[tab].filter(x=>x!==q);update()});
 $('#progress').style.width=n*10+'%';const message=n===10?'기본 질문 선택 완료! 설문 링크를 만들 수 있어요.':`기본 질문 ${10-n}개를 더 골라주세요.`;$('#remaining').textContent=message;$('#previewProgress').textContent=message;$('#makeLink').disabled=n!==10;$('#total').textContent='총 '+(n+state.custom.length)+'문항';
 $('#customList').innerHTML=state.custom.map((q,i)=>`<div class="custom-row"><span>${i+1}. ${esc(q)}</span><button data-delete="${i}" aria-label="직접 질문 ${i+1} 삭제">삭제</button></div>`).join('');document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{state.custom.splice(+b.dataset.delete,1);update()});
 const qs=state.selected.length?surveyQuestions(state,false):state.custom.map((q,i)=>({key:'custom-'+i,trait:'추가 질문',question:q}));const drafts={};$('#preview').querySelectorAll('textarea').forEach(t=>drafts[t.name]=t.value);$('#preview').innerHTML=paperTop()+(qs.length?questionMarkup(qs,true):'<div class="empty"><span class="empty-icon">▤</span><b>질문을 고르면 설문지가 완성돼요</b>왼쪽에서 우리 매장에 필요한 질문을 선택해 주세요.</div>');$('#preview').querySelectorAll('textarea').forEach(t=>t.value=drafts[t.name]||'');
}
async function refreshBadge(){if(!$('#unread'))return;try{const d=await api('/api/submissions/summary');$('#unread').innerHTML=d.unread?`<span class="badge">미확인 ${d.unread}건</span>`:''}catch(e){$('#unread').textContent=e.status===403?'':' · 미확인 건수 조회 실패'}}
$('#closeDialog').onclick=()=>$('#linkDialog').close();$('#copyLink').onclick=async()=>{try{await navigator.clipboard.writeText($('#linkValue').value);$('#copyStatus').textContent='링크를 복사했어요.'}catch{$('#linkValue').select();$('#copyStatus').textContent='자동 복사가 차단됐어요. 선택된 주소를 직접 복사해 주세요.'}};
function makeSubmissionId(){if(typeof crypto.randomUUID==='function')return crypto.randomUUID();const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');return hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);}
function showSubmitError(message){const box=document.querySelector('#submitError');box.textContent=message;box.setAttribute('tabindex','-1');box.scrollIntoView({block:'center',behavior:'smooth'});box.focus({preventScroll:true});}
async function applicant(){let s,qs;try{const token=location.hash.slice(8);if(!/^[A-Za-z0-9_-]+$/.test(token)||token.length>100000)throw Error();s=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(token.replaceAll('-','+').replaceAll('_','/')),c=>c.charCodeAt(0))));qs=surveyQuestions(s)}catch{app.innerHTML='<main class="single"><div class="paper complete"><h2>잘못된 설문 링크예요</h2><p>주소가 잘리거나 문항 정보가 올바르지 않아요.<br>담당자에게 설문 링크를 다시 확인해 주세요.</p></div></main>';return}
 const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(location.hash));const key='hiring-answer-'+Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');let draft=read(sessionStorage,key,{id:makeSubmissionId(),answers:{}});if(!draft.id)draft.id=makeSubmissionId();
 app.innerHTML=`<main class="single"><form class="paper" id="surveyForm" novalidate>${paperTop()}<h3>지원자 정보</h3><div class="info-grid"><div><label class="field" for="name">이름 *</label><input id="name" maxlength="60" autocomplete="name" required></div><div><label class="field" for="birth">생년월일 *</label><input id="birth" type="date" required max="${new Date(Date.now()+32400000).toISOString().slice(0,10)}"></div><div><label class="field" for="phone">전화번호 *</label><input id="phone" type="tel" maxlength="25" autocomplete="tel" required placeholder="010-1234-5678"></div></div><div class="notice">외식업 경험이 없다면 학교·교육·공동 활동의 경험으로 답해도 좋아요. 경험이 없는 문항은 예상 행동과 이유를 적어주세요.</div>${questionMarkup(qs)}<div class="notice">이름·생년월일·전화번호와 답변은 채용 담당자 확인을 위해 서버에 저장됩니다.</div><p id="submitError" class="status" role="alert"></p><button type="submit" id="submit" class="primary" style="width:100%">제출하기</button><p class="footer-note" id="draftStatus">답변은 현재 탭에 임시 저장돼요.</p></form></main>`;
 for(const f of ['name','birth','phone'])$('#'+f).value=draft[f]||'';qs.forEach(q=>$('#a-'+q.key).value=draft.answers?.[q.key]||'');
 const collect=()=>({id:draft.id,survey:s,name:$('#name').value,birth:$('#birth').value,phone:$('#phone').value,answers:Object.fromEntries(qs.map(q=>[q.key,$('#a-'+q.key).value]))});
 $('#surveyForm').oninput=()=>{draft=collect();if(!save(sessionStorage,key,draft))$('#draftStatus').textContent='이 브라우저에서 임시 저장을 사용할 수 없어요. 제출 전 탭을 닫지 마세요.'};
 $('#surveyForm').onsubmit=async e=>{e.preventDefault();if($('#submit').disabled)return;const body=collect();try{validateSubmission(body)}catch(e){showSubmitError(e.message);return}draft=body;save(sessionStorage,key,draft);$('#submit').disabled=true;$('#submit').textContent='답변을 저장하고 있어요…';$('#submitError').textContent='';try{const result=await api('/api/submissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(result.ok!==true)throw Error('저장 완료를 확인하지 못했어요. 다시 시도해 주세요.');try{sessionStorage.removeItem(key)}catch{}app.innerHTML='<main class="single"><div class="paper complete"><div class="icon">✓</div><h2>제출이 완료됐어요</h2><p class="muted">지원자 정보와 답변이 담당자에게 전달됐어요.</p></div></main>'}catch(e){$('#submitError').textContent=e.message;$('#submit').disabled=false;$('#submit').textContent='다시 제출하기'}};
}
function adminPage(){app.innerHTML='<main class="single"><a class="button" href="/">← 설문 만들기</a><div style="margin:30px 0"><p class="topline">OWNER’S INBOX</p><h1>제출된 답변</h1><p class="muted">사장님 전용 · 지원자를 펼치면 확인 상태가 저장돼요.</p></div><div id="adminList"></div><p id="adminStatus" class="status" role="status"></p><button id="more">더 보기</button></main>';let cursor=null,busy=false,total=0;const more=$('#more');
 const load=async()=>{if(busy)return;busy=true;more.disabled=true;$('#adminStatus').textContent='답변을 불러오고 있어요…';try{const data=await api('/api/submissions'+(cursor?'?cursor='+encodeURIComponent(cursor):''));for(const item of data.items){total++;const d=document.createElement('details');const date=new Date(item.submittedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});d.innerHTML=`<summary><span><strong>${esc(item.name)}</strong><br><small class="muted">${esc(date)}</small></span><span class="badge">${item.reviewed?'확인함':'미확인'}</span></summary><div class="details-body"><p class="muted">생년월일 ${esc(item.birth)} · 전화번호 ${esc(item.phone)}</p>${item.questions.map((q,i)=>`<h3 style="margin-top:22px">${i+1}. ${esc(q.question)}</h3><small class="muted">${esc(q.trait)}</small><div class="saved-answer">${esc(q.answer)}</div>`).join('')}<p class="status" role="status"></p></div>`;let saving=false;d.ontoggle=async()=>{if(!d.open||item.reviewed||saving)return;saving=true;d.querySelector('.status').textContent='확인 상태를 저장하고 있어요…';try{await api('/api/submissions/'+item.id,{method:'PATCH'});item.reviewed=true;d.querySelector('.badge').textContent='확인함';d.querySelector('.status').textContent=''}catch(e){d.querySelector('.status').textContent=e.message+' 접었다가 다시 펼치면 재시도해요.'}finally{saving=false}};$('#adminList').append(d)}cursor=data.cursor;more.hidden=!cursor;$('#adminStatus').textContent=total?'':'아직 제출된 답변이 없어요.'}catch(e){$('#adminStatus').textContent=e.message;more.textContent='다시 불러오기'}finally{busy=false;more.disabled=false}};more.onclick=load;load();}
function loginPage(){app.innerHTML='<main class="single"><form id="loginForm" class="paper" novalidate><p class="topline">팡뮤제&짙은 · OWNER</p><h2>사장님 로그인</h2><p class="muted">관리자 계정으로 지원자 답변을 확인하세요.</p><label class="field" for="loginEmail">이메일</label><input id="loginEmail" type="email" autocomplete="username" value="dolmong@yview.co.kr" required><label class="field" for="loginPassword">비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password" required><p id="loginError" class="status" role="alert"></p><button id="loginButton" type="submit" class="primary" style="width:100%;margin-top:20px">로그인</button><p class="muted" style="margin-top:18px">처음 이용하시는 경우 관리자 계정을 먼저 설정해 주세요.</p><p style="margin-top:20px"><a href="/">설문 만들기로 돌아가기</a></p></form></main>';$('#loginForm').onsubmit=async e=>{e.preventDefault();const b=$('#loginButton');if(b.disabled)return;b.disabled=true;b.textContent='로그인하고 있어요…';$('#loginError').textContent='';try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#loginEmail').value,password:$('#loginPassword').value})});location.href='/admin'}catch(e){$('#loginError').textContent=e.message;b.disabled=false;b.textContent='다시 로그인'}}}
if(MODE==='login'||MODE==='forbidden')loginPage();else if(MODE==='admin'){adminPage();const logout=document.createElement('button');logout.textContent='로그아웃';logout.style.marginLeft='12px';logout.onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'});location.href='/admin'}catch(e){$('#adminStatus').textContent=e.message}};document.querySelector('main').insertBefore(logout,document.querySelector('main').children[1]);}else if(location.hash)applicant();else builder();
window.addEventListener('hashchange',()=>location.reload());
</script></body></html>
